version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ims-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-imsadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-imspassword}
      POSTGRES_DB: ${DB_NAME:-ims_factory}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ims-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-imsadmin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MQTT Broker (Eclipse Mosquitto)
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: ims-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mqtt/config:/mosquitto/config
      - mqtt_data:/mosquitto/data
      - mqtt_logs:/mosquitto/log
    networks:
      - ims-network
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  # IMS Backend Application
  ims-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ims-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mqtt-broker:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-5000}
      
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ims_factory}
      DB_USER: ${DB_USER:-imsadmin}
      DB_PASSWORD: ${DB_PASSWORD:-imspassword}
      DB_DIALECT: postgres
      
      # MQTT
      MQTT_BROKER_URL: mqtt://mqtt-broker:1883
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      
      # LDAP (Configure with your LDAP server)
      LDAP_URL: ${LDAP_URL}
      LDAP_BIND_DN: ${LDAP_BIND_DN}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD}
      LDAP_SEARCH_BASE: ${LDAP_SEARCH_BASE}
      
      # Work Order API
      WO_API_BASE_URL: ${WO_API_BASE_URL}
      WO_API_KEY: ${WO_API_KEY}
      
      # Session
      SESSION_SECRET: ${SESSION_SECRET}
      
      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - ./logs:/app/logs
    networks:
      - ims-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
  mqtt_data:
    driver: local
  mqtt_logs:
    driver: local

networks:
  ims-network:
    driver: bridge
